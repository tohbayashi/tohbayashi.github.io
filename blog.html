<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Takumi S. Ohbayashi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding-top: 72px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            color: #171717;
            line-height: 1.8;
        }

        header {
            line-height: 1.7;
        }

        @media (max-width: 800px) {
            body {
                padding-top: 64px;
            }
        }

        main {
            flex: 1;
            width: min(100%, 1000px);
            margin: 0 auto;
            padding: clamp(32px, 7vw, 72px) 24px;
        }

        h1 {
            margin: 0 0 28px;
            font-size: clamp(32px, 5vw, 42px);
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr));
            gap: 24px;
        }

        .blog-card {
            display: block;
            overflow: hidden;
            border: 1px solid #dbe2e9;
            border-radius: 16px;
            background: #fff;
            color: #003366;
            text-decoration: none;
        }

        .blog-card:hover,
        .blog-card:focus-visible {
            box-shadow: 0 4px 16px #00336629;
        }

        .blog-card img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background: #eef2ee;
        }

        .blog-card h2 {
            margin: 0;
            padding: 16px 20px;
            font-size: 20px;
            line-height: 1.5;
        }

        .announcement {
            margin-top: 36px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .announcement time {
            color: #666;
            font-size: 14px;
        }

        .announcement h2 {
            margin: 4px 0;
            font-size: 20px;
        }

        .announcement p {
            margin: 8px 0 0;
        }

        footer {
            background: #003366;
            color: #fff;
            padding: 24px;
            text-align: center;
            font-size: 13px;
        }
    </style>

    <link rel="stylesheet" href="header.css">
</head>

<body>
    <header>
        <nav class="nav" aria-label="メインナビゲーション">
            <a href="index.html" class="logo">Takumi S. Ohbayashi</a>

            <button class="menu-toggle"
                    id="menu-toggle"
                    type="button"
                    aria-label="メニューを開く"
                    aria-expanded="false"
                    aria-controls="nav-links">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="nav-links" id="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#about">About</a>
                <a href="index.html#research">Research</a>
                <a href="index.html#news">News</a>
                <a href="index.html#publications">Publications</a>
                <a href="blog.html" aria-current="page">Blog</a>
                <a href="index.html#contact">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        <h1>Blog</h1>

        <div class="blog-grid">
            <article>
                <a class="blog-card" href="blog/sauerkraut.html">
                    <img src="images/IMG_8540.heic" alt="">
                    <h2>研究室でザワークラウトを作製中</h2>
                </a>
            </article>

            <!-- 次の記事のカードはこの位置に追加 -->
        </div>

        <section class="announcement">
            <time datetime="2026-11-15">2026.11.15</time>
            <h2>ブログを開設しました</h2>
            <p>神経科学や日々の研究活動について、記事を投稿していく予定です。</p>
        </section>
    </main>

    <footer>
        © 2026 Takumi S. Ohbayashi
    </footer>

    <script src="header.js"></script>
</body>
</html>
