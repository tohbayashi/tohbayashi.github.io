<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Takumi S. Ohbayashi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            color: #171717;
            line-height: 1.8;
        }

        header, footer {
            background: #003366;
            color: #fff;
        }

        .nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 30px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px 24px;
        }

        .nav a {
            color: inherit;
            text-decoration: none;
        }

        .nav a:hover {
            text-decoration: underline;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 18px;
        }

        main {
            flex: 1;
            width: min(100%, 1000px);
            margin: 0 auto;
            padding: clamp(32px, 7vw, 72px) 24px;
        }

        h1 {
            margin: 0 0 28px;
            font-size: clamp(32px, 5vw, 42px);
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr));
            gap: 24px;
        }

        .blog-card {
            display: block;
            overflow: hidden;
            border: 1px solid #dbe2e9;
            border-radius: 16px;
            background: #fff;
            color: #003366;
            text-decoration: none;
        }

        .blog-card:hover, .blog-card:focus-visible {
            box-shadow: 0 4px 16px #00336629;
        }

        .blog-card img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background: #eef2ee;
        }

        .blog-card h2 {
            margin: 0;
            padding: 16px 20px;
            font-size: 20px;
            line-height: 1.5;
        }

        .photo-credit {
            margin: 8px 0 0;
            color: #555;
            font-size: 12px;
        }

        .announcement {
            margin-top: 36px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .announcement time {
            color: #666;
            font-size: 14px;
        }

        .announcement h2 {
            margin: 4px 0;
            font-size: 20px;
        }

        .announcement p {
            margin: 8px 0 0;
        }

        footer {
            padding: 24px;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <header>
        <nav class="nav" aria-label="メインナビゲーション">
            <a class="logo" href="index.html">Takumi S. Ohbayashi</a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#about">About</a>
                <a href="index.html#research">Research</a>
                <a href="index.html#news">News</a>
                <a href="index.html#publications">Publications</a>
                <a href="blog.html" aria-current="page">Blog</a>
                <a href="index.html#contact">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        <h1>Blog</h1>

        <div class="blog-grid">
            <article>
                <a class="blog-card" href="blog/sauerkraut.html">
                    <img
                        src="https://upload.wikimedia.org/wikipedia/commons/5/56/Sauerkraut_Jar.jpg"
                        alt=""
                        width="1860"
                        height="2841"
                    >
                    <h2>研究室でザワークラウトを作製中</h2>
                </a>

                <p class="photo-credit">
                    参考写真：
                    <a href="https://commons.wikimedia.org/wiki/File:Sauerkraut_Jar.jpg">Bdubay / Wikimedia Commons</a>
                    （<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a>、表示範囲をトリミング）
                </p>
            </article>

            <!-- 次の記事のカードはこの位置に追加 -->
        </div>

        <section class="announcement">
            <time datetime="2026-11-15">2026.11.15</time>
            <h2>ブログを開設しました</h2>
            <p>神経科学や日々の研究活動について、記事を投稿していく予定です。</p>
        </section>
    </main>

    <footer>
        © 2026 Takumi S. Ohbayashi
    </footer>
</body>
</html>
